<!-- The shared header stays visible while the router swaps employee screens below. -->
<header class="topbar">
  <h1>{{ title }}</h1> <!-- Interpolates the title property from AppComponent. -->
  <nav>
    <a routerLink="/employees">Employees</a> <!-- Navigates to the employee list without reloading the page. -->
    <a routerLink="/employees/new">Add Employee</a> <!-- Opens the form in create mode. -->
  </nav>
</header>

<!-- Angular renders the component that matches the current route at this location. -->
<main class="container">
  <router-outlet />
</main>
